name: 麦门 PR 税

# 复制这个文件到你的仓库 .github/workflows/ 下，改一行 uses 即可。
# 必需的 Secret：MCD_MCP_TOKEN（麦当劳 MCP Token，可留空则用内置价格快照）

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  tax:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: M-China-Dev/bigmac-pr-tax@v1
        with:
          mcd-mcp-token: ${{ secrets.MCD_MCP_TOKEN }}
          # 想核价到具体门店就填这两项；留空则用默认的 上海·人民广场
          mcd-city: 上海
          mcd-keyword: 人民广场
          # store-code: '1450713'
          max-burgers: '20'
